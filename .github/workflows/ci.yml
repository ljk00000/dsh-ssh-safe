name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      # checkJs is only useful if something runs it. tsconfig.json exists and
      # this step is what makes it a gate instead of decoration.
      - name: Typecheck (checkJs)
        run: npm run typecheck

      # `node --test` with no path, not `node --test "test/*.test.js"`: the glob
      # form needs Node 21+, and on Node 20 the quoted pattern is taken as a
      # literal path ("Could not find .../*.test.js"). Automatic discovery works
      # on every version in the matrix.
      #
      # The TAP reporter, not the default one: a failing run has to name the test
      # that failed somewhere a reader of the run page can see it, and the step
      # log needs an authenticated request. TAP lines are plain ASCII, which also
      # survives both shells.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=60000 2>&1 | tee test-output.txt

      # Annotations are readable without authentication; the log is not. Each
      # failing test becomes one error annotation, so the run page (and the
      # notification email) says which test failed instead of "exit code 1".
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then echo "::error::no test output was captured"; exit 0; fi
          node scripts/ci-annotations.mjs test-output.txt
          echo "--- failure details ---"
          grep -A8 "^not ok " test-output.txt | head -160
